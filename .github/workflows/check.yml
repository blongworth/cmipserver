# Checks only. This workflow never deploys (deploy runs from HPC).
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Test
        run: uv run pytest

      - name: Validate YAML
        run: >
          uv run python -c "import sys, yaml, pathlib;
          files = [*pathlib.Path('.github').rglob('*.yml'), *pathlib.Path('site').glob('_*.yml')];
          [yaml.safe_load(f.read_text()) for f in files];
          print(f'{len(files)} YAML files OK')"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      # site/data/ is generated, not committed; build it from the test fixtures.
      - name: Site data from fixtures
        run: >
          uv run scripts/summarize_catalog.py
          --catalog tests/fixtures/sample_catalog.csv
          --catalog tests/fixtures/whoi_20crv3.csv
          --products manifests/catalogs.yaml
          --vocab tests/fixtures/whoi_cmip_vocabulary.csv --out site/data

      # Notebooks are committed without outputs and need the store, so CI renders
      # without executing them.
      - name: Render site
        run: uv run quarto render site --no-execute

      # The dataset browser in headless Chrome (preinstalled on the runner);
      # skipped by the Test step above because the site is not rendered yet.
      - name: Browser tests
        run: uv run pytest tests/test_browse_page.py
        env:
          REQUIRE_BROWSER: "1"

      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/site/_site" "site/_site/**/*.html"
          fail: true

# Shared by cmip.conf (HTTPS) and cmip-http-interim.conf (HTTP, before the
# certificate). Included inside their <VirtualHost>; installed by
# infra/vm/setup.sh to /etc/apache2/cmip/common.conf. For IT review (C-17).
# Modules: alias, headers, mime, ratelimit (setup.sh enables them).

ServerName cmip.whoi.edu

# --- Site: the live release (pull_site.sh swaps the current symlink) ---------
DocumentRoot /srv/cmip/current/site
<Directory /srv/cmip>
    # current -> releases/<stamp> is owned by cmipsite, like its target;
    # releases contain no symlinks (pull_site.sh refuses them)
    Options -Indexes +SymLinksIfOwnerMatch
    AllowOverride None
    # Access per PI-4: "all granted" behind a WHOI-only address, or
    # Require ip <WHOI ranges from IT> if the host gets a public IP.
    Require all granted
</Directory>

# --- Downloads: /data/<path>.nc -> /vast/cmip6/data/<path>.nc -----------------
# https_prefix (<site_url>/data) maps to vast_prefix (/proj/cmip6/data). Only
# URLs ending in .nc go to VAST; everything else under /data/ is the site's own
# data/ dir (site_config.json, the catalog summary), and no URL lists VAST.
AliasMatch "^/data/(.+\.nc)$" "/vast/cmip6/data/$1"
<Directory /vast/cmip6/data>
    # no listings, no symlinks, no .htaccess
    Options None
    AllowOverride None
    Require all denied
    <FilesMatch "\.nc$">
        # PI-4, as above
        Require all granted
    </FilesMatch>
    # byte ranges stay on (Apache default); never compress
    SetEnv no-gzip 1
    # 20 MB/s per connection (KiB/s); tune from logs (C-17)
    SetOutputFilter RATE_LIMIT
    SetEnv rate-limit 20480
    Header set Cache-Control "public, max-age=86400"
</Directory>
AddType application/x-netcdf .nc

# --- Headers -------------------------------------------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# Quarto's OJS runtime and inline scripts need the unsafe-* entries.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'"

# Cache: pages and site data change with each build; vendor/ and site_libs/
# paths carry no version, so cache them for a day, not "forever".
<LocationMatch "(/|\.html|\.json|\.xml)$">
    Header set Cache-Control "public, max-age=300"
</LocationMatch>
<LocationMatch "^/(vendor|site_libs)/">
    Header set Cache-Control "public, max-age=86400"
</LocationMatch>

# Logs hold client IPs; agree retention with IT (C-17).
ErrorLog ${APACHE_LOG_DIR}/cmip_error.log
CustomLog ${APACHE_LOG_DIR}/cmip_access.log combined

# cmip.whoi.edu over plain HTTP, for the WHOI-only soft launch before the TLS
# certificate exists (docs/deploy-plan.md, §3a). Do not announce: whoi.edu's
# HSTS (includeSubDomains) makes browsers that visited whoi.edu refuse
# http://cmip.whoi.edu. Test users browse http://10.128.43.19/ (an IP is not
# covered by HSTS); wget/curl/xarray downloads work by name.
#
# No https redirect and NO HSTS header here: HSTS before TLS works would lock
# users out for its max-age. Replace with cmip.conf at the cutover.

<VirtualHost *:80>
    Include /etc/apache2/cmip/common.conf
</VirtualHost>

# Apache vhost for cmip.whoi.edu (docs/vm-spec.md section 4).
# Install: /etc/apache2/sites-available/cmip.conf, then
#   a2enmod ssl headers ratelimit qos expires env && a2dissite 000-default
#   a2ensite cmip && apachectl configtest && systemctl reload apache2
# Items marked TBD are open decisions (docs/vm-spec.md); do not guess them.

<VirtualHost *:80>
    ServerName cmip.whoi.edu
    Redirect permanent / https://cmip.whoi.edu/
</VirtualHost>

<VirtualHost *:443>
    ServerName cmip.whoi.edu
    DocumentRoot /srv/cmip/current

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cmip.whoi.edu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cmip.whoi.edu/privkey.pem

    # Site: the live release symlink only.
    <Directory /srv/cmip/current>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride None
        # TBD (PI-4): or Require ip <WHOI ranges>
        Require all granted
    </Directory>

    # Downloads: read-only mount, .nc files only, no listings.
    Alias /download /vast/cmip6/data
    <Directory /vast/cmip6/data>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
        <FilesMatch "\.nc$">
            # TBD (PI-4): match the site rule above
            Require all granted
        </FilesMatch>
        AddType application/x-netcdf .nc
        SetEnv no-gzip 1
        SetOutputFilter RATE_LIMIT
        # KB/s per connection; tune from logs
        SetEnv rate-limit 20000
    </Directory>

    <IfModule qos_module>
        # tune from logs
        QS_SrvMaxConnPerIP 10
    </IfModule>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'"

    ExpiresActive On
    <LocationMatch "^/(vendor|site_libs)/">
        ExpiresDefault "access plus 1 month"
    </LocationMatch>
    <LocationMatch "\.(html|json)$">
        ExpiresDefault "access plus 300 seconds"
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/cmip-error.log
    CustomLog ${APACHE_LOG_DIR}/cmip-access.log combined
</VirtualHost>

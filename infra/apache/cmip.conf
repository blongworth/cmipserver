# cmip.whoi.edu over HTTPS (production). Enable once the certificate is
# installed (docs/deploy-plan.md, §3), in place of cmip-http-interim.conf:
#   sudo a2dissite cmip-http-interim && sudo a2ensite cmip && sudo apachectl configtest
#   sudo systemctl reload apache2
# then rebuild the site with https:// URLs (site/_production.yml).
#
# If the host is public (PI-4), also limit connections per IP with mod_qos
# (libapache2-mod-qos; server-wide, so outside the vhosts):
#   <IfModule qos_module>
#       QS_SrvMaxConnPerIP 10
#   </IfModule>

<VirtualHost *:80>
    ServerName cmip.whoi.edu
    Redirect permanent / https://cmip.whoi.edu/
</VirtualHost>

<VirtualHost *:443>
    Include /etc/apache2/cmip/common.conf

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    # certbot's paths; for an IT-issued (SSL.com) certificate, point these at
    # the installed files instead (IT-9)
    SSLCertificateFile /etc/letsencrypt/live/cmip.whoi.edu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cmip.whoi.edu/privkey.pem

    # Start short; raise to max-age=31536000 after a week without TLS problems.
    # Never send HSTS from the HTTP vhost.
    Header always set Strict-Transport-Security "max-age=300"
</VirtualHost>

# Quarto 1.10.19 (see README.md). Render from the repo root with:
#   uv run quarto render site
project:
  type: website
  output-dir: _site
  pre-render: ../scripts/write_site_config.py
  # Points CDN scripts (notebook pages) at site/vendor/; fails on any other.
  post-render: ../scripts/localize_site_scripts.py
  resources:
    - data/
    - vendor/
    - robots.txt

shortcodes:
  - _filters/old-site.lua

website:
  title: "WHOI CMIP Data Server"
  site-url: https://cmip.whoi.edu  # keep in sync with site_url in _variables.yml
  description: "CMIP6 model output and reanalysis products on WHOI's VAST storage"
  search: true
  navbar:
    left:
      - href: browse.qmd
        text: Browse
      - href: variables.qmd
        text: Variables
      - href: holdings.qmd
        text: Holdings
      - text: Data Access
        menu:
          - href: access.qmd
            text: Access (HPC, SMB, HTTPS, Globus)
          - href: download-guide.qmd
            text: Download guide
          - href: access.qmd#public-cloud-copies
            text: Cloud mirrors
          - href: catalog.qmd
            text: Catalog
      - text: Learn
        menu:
          - href: notebooks/quickstart.ipynb
            text: Quickstart
          - href: notebooks/20crv3.ipynb
            text: 20CRv3 monthly means
          - href: https://ashleylasinsky.github.io/whoi-climate-tutorial_2026/pages/intro.html
            text: WHOI short course on climate model output
      - href: blog/index.qmd
        text: Blog
    right:
      - href: about.qmd
        text: About
      - href: cite.qmd
        text: Cite
      - href: report.qmd
        text: Help
      # Temporary; remove with old_site_url in _variables.yml (task 6.3).
      - href: http://cmip6.whoi.edu
        text: Old site
      # Keep in sync with github_repo in _variables.yml.
      - icon: github
        href: https://github.com/blongworth/cmipserver
        aria-label: Source code and issues on GitHub
      - icon: rss
        href: blog/index.xml
        aria-label: Blog RSS feed
  page-footer:
    left: "Woods Hole Oceanographic Institution"
    right: "{{< old-site >}}"

format:
  html:
    theme: [cosmo, theme.scss]
    css: fonts.css
    toc: true

execute:
  freeze: auto

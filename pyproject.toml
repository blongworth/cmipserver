[project]
name = "whoi-cmip-reorg-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brett Longworth", email = "blongworth@whoi.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=2.0.0",
]

[project.scripts]
whoi-cmip-reorg-code = "whoi_cmip_reorg_code:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[project]
name = "whoi-cmip-reorg-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brett Longworth", email = "blongworth@whoi.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "intake-esm>=2025.7.9",
    "lychee>=0.2.2",
    "polars>=2.0.0",
]

[project.scripts]
whoi-cmip-reorg-code = "whoi_cmip_reorg_code:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
site = [
    "ipykernel>=7.4.0",
    "jupyter-core>=5.9.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "netcdf4>=1.7.5.1.post1",
    "plotly>=7.1.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
